<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:24px;background:var(--paper-warm)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Field, Input, Textarea, Select, Checkbox, Radio, Switch } = window.PowerABADesignSystem_870410;
function Demo(){const [age,setAge]=React.useState("2-3");return <div className="grid">
<Field label="Child's first name" required hint="We only use this to prepare your intake."><Input placeholder="First name"/></Field>
<Field label="Best phone number"><Input icon="phone" placeholder="(555) 555-5555"/></Field>
<Field label="Program of interest"><Select placeholder="Choose a program" options={["Before Care","Preschool Day Program","After-School Care"]}/></Field>
<Field label="Email" error="Please enter a valid email address."><Input invalid defaultValue="maria@" /></Field>
<Field label="Tell us a little about your child" style={{gridColumn:'span 2'}}><Textarea rows={3} placeholder="Strengths, routines, anything you'd like us to know."/></Field>
<div style={{display:'flex',flexDirection:'column',gap:4}}>
<Radio name="a" value="2-3" checked={age==="2-3"} onChange={()=>setAge("2-3")} label="2 – 3 years old"/>
<Radio name="a" value="4-6" checked={age==="4-6"} onChange={()=>setAge("4-6")} label="4 – 6 years old"/></div>
<div style={{display:'flex',flexDirection:'column',gap:4}}>
<Checkbox defaultChecked label="Spanish-speaking team member"/>
<Switch defaultChecked label="Text me reminders"/></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
