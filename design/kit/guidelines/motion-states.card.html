<!-- @dsCard group="Spacing" viewport="700x170" name="Motion & interaction states" subtitle="Gentle durations; hover lifts, press shrinks" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-body)}.g{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:13px;color:var(--text-body)}.k{font-family:var(--font-mono);font-size:11px;color:var(--brand-indigo)}.row{display:flex;gap:10px;align-items:center}.pill{display:inline-flex;align-items:center;padding:0 22px;height:44px;border-radius:999px;background:var(--brand-red);color:#fff;font-weight:600;font-size:14px;box-shadow:var(--shadow-brand)}</style></head><body><div class="g"><div><div class="k">--duration-fast 120ms</div><div class="k">--duration-base 200ms</div><div class="k">--duration-slow 360ms</div><div class="k">--ease-out-soft cubic-bezier(.16,.84,.44,1)</div><div style="margin-top:8px">No bounces, no parallax, no autoplaying motion.</div></div><div class="row"><span class="pill">Rest</span><span class="pill" style="transform:translateY(-2px);background:#AE0402">Hover</span><span class="pill" style="transform:scale(.97);background:#AE0402">Press</span></div></div></body></html>
