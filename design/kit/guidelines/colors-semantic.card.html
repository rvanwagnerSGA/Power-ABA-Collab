<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-body)}.rows{display:flex;flex-direction:column;gap:8px}.r{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text-body)}.k{width:34px;height:34px;border-radius:var(--radius-sm);flex:0 0 auto}.t{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);min-width:170px}</style></head><body><div class="rows"><div class="r"><span class="k" style="background:var(--action-primary)"></span><span class="t">--action-primary</span><span>Primary CTA, headline first half, active states</span></div><div class="r"><span class="k" style="background:var(--action-secondary)"></span><span class="t">--action-secondary</span><span>Secondary CTA, headline accent half, focus ring</span></div><div class="r"><span class="k" style="background:var(--status-success)"></span><span class="t">--status-success</span><span>Confirmation only — never a brand surface</span></div><div class="r"><span class="k" style="background:var(--text-heading-alt)"></span><span class="t">--text-heading-alt</span><span>Sub-headings and body on light surfaces</span></div></div></body></html>
