<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Soft everywhere; every button is a pill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-body)}.r{display:flex;gap:14px;flex-wrap:wrap}.b{width:92px;height:70px;background:var(--brand-indigo-wash);border:2px solid var(--brand-indigo);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--font-mono);font-size:10px;color:var(--brand-indigo)}</style></head><body><div class="r"><div class="b" style="border-radius:6px">xs 6</div><div class="b" style="border-radius:10px">sm 10</div><div class="b" style="border-radius:16px">md 16</div><div class="b" style="border-radius:24px">lg 24</div><div class="b" style="border-radius:32px">xl 32</div><div class="b" style="border-radius:48px">blob 48</div><div class="b" style="border-radius:999px">pill 999</div></div></body></html>
