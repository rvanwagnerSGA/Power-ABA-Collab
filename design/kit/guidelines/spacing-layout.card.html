<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-body)}.page{background:var(--surface-sunken);border-radius:var(--radius-md);padding:20px}.sect{background:var(--paper);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-sm)}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-bottom:6px}.bar{height:10px;border-radius:5px;background:var(--ink-100);margin-bottom:8px}.bar.w1{width:55%}.bar.w2{width:80%}</style></head><body><div class="page"><div class="lbl">--section-y 96px &middot; --container-max 1200px &middot; --gutter 24px</div><div class="sect"><div class="lbl">--card-pad 28px</div><div class="bar w1"></div><div class="bar w2"></div><div class="bar w2"></div></div></div></body></html>
